<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><title>Şef Tezgâhı</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{--wall:#1b2838;--ink:#fff7ea;--mute:#a9b8c8;--tom:#ff5d47;--mint:#4fd1a1;--but:#ffd86b;--glass:rgba(255,255,255,.08);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#2f4a66,transparent 55%),linear-gradient(#1b2838,#101a26);color:var(--ink);font-family:Fredoka,'Trebuchet MS',system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 56px),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 56px);pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer;border:0}
header{position:relative;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;max-width:980px;margin:auto}
.logo{font-weight:700;font-size:22px;background:none;display:flex;gap:8px;align-items:center}
.pill{background:var(--glass);padding:6px 14px;border-radius:99px;font-weight:600}
main{position:relative;max-width:980px;margin:auto;padding:0 16px 120px}
#stage.in{animation:sw .45s cubic-bezier(.2,.8,.2,1)}
@keyframes sw{from{opacity:0;transform:translateY(24px) scale(.98)}}
.hero{display:flex;gap:16px;align-items:center;margin:8px 0 16px}
.hero h1{margin:0;font-size:clamp(30px,7vw,52px);line-height:1}.hero p{margin:6px 0 0;color:var(--mute)}
.chef{font-size:72px;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.daily{width:100%;padding:14px;border-radius:18px;background:linear-gradient(90deg,var(--tom),#ff9a3d);font-weight:600;font-size:17px;margin-bottom:16px;box-shadow:0 8px 24px rgba(255,93,71,.35);transition:transform .2s}
.daily:active{transform:scale(.97)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.cat{position:relative;aspect-ratio:1;border-radius:26px;background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:17px;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.35);animation:pop .6s backwards;animation-delay:calc(var(--i)*60ms);transition:transform .25s}
.cat span{font-size:56px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3));transition:transform .3s}
.cat:hover{transform:translateY(-6px) rotate(-2deg)}.cat:hover span{transform:scale(1.2) rotate(8deg)}
@keyframes pop{from{opacity:0;transform:scale(.4) translateY(30px)}}
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}.top h2{margin:0;color:var(--c)}
.back{background:var(--glass);padding:8px 14px;border-radius:99px}
.bubble{background:var(--glass);border-radius:18px;padding:12px 16px;margin:10px 0;display:flex;gap:10px;align-items:center;animation:sw .5s}
.bubble u{color:var(--but);cursor:pointer;margin-left:6px}
.mlist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.mc{background:var(--glass);border-radius:20px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:.2s;border:2px solid transparent}
.mc:hover{border-color:var(--but);transform:translateY(-4px)}.mc span{font-size:34px}.mc b{font-size:18px}.mc small{color:var(--mute)}.mc.free{background:linear-gradient(135deg,#2b6e5a,#1d4c5e)}
.steps{display:flex;gap:6px;margin:6px 0 14px}.steps span{flex:1;text-align:center;padding:6px 2px;border-radius:99px;background:var(--glass);font-size:13px;color:var(--mute)}
.steps .d{background:var(--mint);color:#08251c}.steps .a{background:var(--but);color:#3a2a00;font-weight:600;animation:pulse 1.5s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
h3{margin:16px 0 8px}
.shelf{display:flex;flex-wrap:wrap;gap:10px;padding:12px;background:var(--glass);border-radius:18px;border-bottom:6px solid #b9814f}
.it{width:84px;padding:8px 2px;border-radius:16px;background:rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;transition:.2s}
.it i{font-style:normal;font-size:38px;transition:transform .25s}.it small{font-size:12px;text-align:center;line-height:1.1}
.it:hover i{transform:translateY(-4px) scale(1.1)}
.it.on{background:rgba(79,209,161,.25);outline:2px solid var(--mint);animation:jump .4s}
.it.on::after{content:"✓";position:absolute;top:-6px;right:-6px;background:var(--mint);color:#08251c;width:20px;height:20px;border-radius:50%;font-size:13px;font-weight:700}
@keyframes jump{40%{transform:translateY(-12px) scale(1.1)}}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(12,20,30,.92);backdrop-filter:blur(8px);display:flex;gap:12px;align-items:center;z-index:5}
#bk{flex:1;display:flex;gap:4px;overflow-x:auto;font-size:26px;min-height:38px;align-items:center;color:var(--mute)}.chip{animation:pop .3s}
.go,.go2{padding:13px 22px;border-radius:16px;background:linear-gradient(var(--mint),#2fa77c);color:#06241a;font-weight:700;font-size:16px;box-shadow:0 5px 0 #1c7357;transition:.15s}
.go2{background:linear-gradient(var(--but),#f2a93b);color:#3a2300;box-shadow:0 5px 0 #b97712}
.go:active,.go2:active{transform:translateY(4px);box-shadow:0 1px 0 #1c7357}
.go:disabled{opacity:.4;pointer-events:none}
.go,.go2{margin:14px 8px 0 0}
.board{position:relative;height:210px;border-radius:20px;background:repeating-linear-gradient(90deg,#c58b55 0 38px,#b97f4a 38px 40px);box-shadow:inset 0 -8px 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.board.shake{animation:sh .18s}@keyframes sh{50%{transform:translateY(4px)}}
.food{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:80%;font-size:44px}.food span{transition:transform .2s}
.knife{position:absolute;top:10px;right:22%;font-size:70px;transform:rotate(-30deg);transform-origin:bottom}
.knife.slam{animation:sl .22s}@keyframes sl{40%{transform:translateY(90px) rotate(-5deg)}}
.bit{position:absolute;font-size:16px;animation:fly .7s forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
.gauge2{height:12px;background:var(--glass);border-radius:9px;margin-top:12px;overflow:hidden}.gauge2 div{height:100%;width:0;background:var(--mint);transition:width .2s}
.kit{--heat:0;position:relative;height:270px;border-radius:22px;background:linear-gradient(#2a3d52,#1d2c3d);overflow:hidden}
.kit::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(#444,#222)}
.vsl{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);font-size:110px;line-height:1;z-index:2}
.ing{position:absolute;left:50%;bottom:120px;width:120px;z-index:3;font-size:28px}
.ing span{position:absolute;left:var(--x);bottom:var(--y);animation:bub .9s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes bub{to{transform:translateY(-12px) rotate(14deg)}}
.flames{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:4}
.flames b{width:20px;height:38px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:radial-gradient(circle at 50% 80%,#fff3a0,#ff9a1f 45%,#ff3d1f);transform-origin:bottom;transform:scaleY(calc(.4 + var(--heat)*.9));animation:fl .35s infinite alternate}
.flames b:nth-child(2n){animation-delay:.12s}.flames b:nth-child(3n){animation-delay:.2s}
@keyframes fl{to{filter:brightness(1.3);margin-top:-4px}}
.oven .vsl{width:230px;height:150px;border:10px solid #666;border-radius:14px;background:radial-gradient(circle,rgba(255,140,40,calc(.15 + var(--heat)*.75)),#1a1a1a 85%);box-shadow:0 0 calc(var(--heat)*50px) rgba(255,120,30,.7)}
.oven .ing{bottom:90px}
.grill .vsl{width:240px;height:18px;bottom:96px;font-size:0;background:repeating-linear-gradient(90deg,#777 0 6px,transparent 6px 20px)}
.grill .ing{bottom:112px}
.coals{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:1}.coals i{width:26px;height:26px;border-radius:50%;background:#ff5a1f;box-shadow:0 0 calc(6px + var(--heat)*24px) #ff7a2f;opacity:calc(.35 + var(--heat)*.65);animation:fl .3s infinite alternate}
.mix .ing{bottom:140px}.mix .vsl.t{animation:tos .3s}@keyframes tos{40%{transform:translateX(-50%) rotate(-12deg) translateY(-14px)}}
.steam{position:absolute;left:50%;bottom:200px;width:90px;transform:translateX(-50%);z-index:5;opacity:var(--heat)}
.steam b{position:absolute;bottom:0;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.4);filter:blur(7px);animation:st 2.4s infinite;left:calc(var(--n,0)*18px)}
.steam b:nth-child(2){--n:1;animation-delay:.5s}.steam b:nth-child(3){--n:2;animation-delay:1s}.steam b:nth-child(4){--n:3;animation-delay:1.5s}.steam b:nth-child(5){--n:4;animation-delay:.2s}
@keyframes st{from{transform:translateY(0) scale(.6)}to{transform:translateY(-80px) scale(2);opacity:0}}
.kit.hot .steam b{background:rgba(30,30,30,.6)}.kit.hot{animation:sh .15s infinite}
.gauge{position:relative;height:26px;background:var(--glass);border-radius:14px;margin-top:14px;overflow:hidden}
.zone{position:absolute;left:60%;width:25%;top:0;bottom:0;background:rgba(79,209,161,.45);border-inline:2px solid var(--mint)}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#4aa3ff,var(--but),var(--tom));border-radius:14px}
.hint{color:var(--mute);margin:8px 0 0;font-weight:500}.hint.ok{color:var(--mint)}.hint.bad{color:var(--tom)}
.prev{position:relative;height:250px;border-radius:22px;background:linear-gradient(#e9ddc8 0 0) center/100% 100%;background:repeating-conic-gradient(#c8372d 0 25%,#f4f1ea 0 50%) 0 0/48px 48px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.plate{position:relative;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#fff 52%,#dcdcdc 54%,#fff 60%);box-shadow:0 14px 24px rgba(0,0,0,.4);animation:drop .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{from{transform:translateY(-160px) scale(1.3);opacity:0}}
.plate.p1{background:radial-gradient(circle,#f5f5f5 20%,#fff 45%,#cfd6dd 62%,#fff 66%)}
.plate.p2{background:radial-gradient(circle,#e7ecf0 35%,#fff 62%,#ccc 66%)}
.plate.p3{border-radius:18px;width:240px;height:170px;background:repeating-linear-gradient(90deg,#b07a46 0 30px,#a26f3c 30px 32px)}
.plate.p4{background:radial-gradient(circle,#3a3a3a 60%,#1c1c1c 62%)}
.plate.p4::after{content:"";position:absolute;right:-60px;top:46%;width:70px;height:16px;background:#222;border-radius:8px}
.dish{position:absolute;inset:0}.dish span{position:absolute;font-size:30px;transform:translate(-50%,-50%);animation:pop .5s backwards}
.plate em{position:absolute;font-style:normal;font-size:20px;animation:pop .4s}
.plate.fly{animation:serve 1.1s forwards}
@keyframes serve{40%{transform:translateY(-20px) scale(1.1)}to{transform:translateY(-60px) scale(.5);opacity:0}}
.ov{position:fixed;inset:0;background:rgba(5,10,16,.8);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;animation:fi .3s}
@keyframes fi{from{opacity:0}}
.card{background:linear-gradient(#26384d,#1a2838);border-radius:28px;padding:22px;max-width:380px;width:100%;text-align:center;animation:pop .6s cubic-bezier(.3,1.4,.5,1);max-height:92vh;overflow:auto}
.face{font-size:64px;animation:bob 1.6s infinite}.card h2{margin:4px 0}
.stars span{font-size:40px;color:#46586b;display:inline-block}.stars .on{color:var(--but);animation:star .5s backwards;animation-delay:calc(var(--k)*.2s + .3s)}
@keyframes star{from{transform:scale(0) rotate(-90deg)}}
.pts{font-size:44px;font-weight:700;color:var(--mint)}.pts small{font-size:14px;color:var(--mute)}
.br{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}.br span{width:70px;text-align:left}.br i{flex:1;height:10px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden}
.br b{display:block;height:100%;background:var(--mint);width:0;animation:gr 1s .6s forwards}@keyframes gr{to{width:var(--w)}}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:30;animation:cfa 3s linear forwards}
@keyframes cfa{to{transform:translateY(105vh) rotate(720deg)}}
.pour{position:absolute;inset:0;z-index:6;pointer-events:none}.pour i{position:absolute;top:30px;font-style:normal;font-size:13px;animation:pr .7s ease-in forwards;opacity:0}
@keyframes pr{0%{opacity:1}to{transform:translateY(150px);opacity:0}}
.shk{position:absolute;top:0;left:50%;font-size:46px;animation:shk .8s forwards}
@keyframes shk{0%{transform:translate(-50%,-30px) rotate(0)}30%,70%{transform:translate(-50%,0) rotate(130deg)}to{transform:translate(-50%,-40px);opacity:0}}
.spb{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding:10px;background:var(--glass);border-radius:16px}.spb small:first-child{width:100%;color:var(--mute)}.it b{position:absolute;top:-6px;right:-6px;background:var(--but);color:#3a2300;border-radius:99px;padding:0 7px;font-size:12px}
.ing .pc{animation:din .5s var(--d) backwards,bub .8s calc(var(--d) + .5s) infinite alternate}
@keyframes din{from{transform:translateY(-120px) scale(1.2);opacity:0}}
.ing .pc.egg{animation:none}.egg i{position:absolute;left:-15px;top:-18px;font-style:normal;font-size:30px;animation:shl .7s var(--d) forwards}
@keyframes shl{0%{transform:translateY(-110px)}60%{transform:translateY(0)}to{transform:translateY(10px) rotate(50deg);opacity:0}}
.egg .fe{left:0;top:0;animation:spl .5s calc(var(--d) + .55s) backwards}
@keyframes spl{from{transform:translate(-50%,-50%) scale(0)}}
.fe,.be{position:absolute;display:block;transform:translate(-50%,-50%)}
.fe{width:54px;height:46px;background:rgba(255,255,255,calc(.3 + var(--heat,1)*.7));border-radius:52% 48% 58% 42%/48% 60% 40% 52%;box-shadow:0 3px 6px rgba(0,0,0,.25)}
.fe::after{content:"";position:absolute;left:32%;top:24%;width:21px;height:21px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe066,#ff9a0f)}
.fe.bn,.hot .fe{filter:brightness(.55) sepia(1)}
.be{width:30px;height:38px;border-radius:50%/60% 60% 40% 40%;background:#fff;box-shadow:0 3px 5px rgba(0,0,0,.25)}
.be::after{content:"";position:absolute;left:24%;top:32%;width:52%;height:40%;border-radius:50%;background:#ffc533}
.dish b{animation:pop .5s backwards}
.soup{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--wc) 75%,#fff),var(--wc));box-shadow:inset 0 4px 8px rgba(0,0,0,.3)}
.pan .vsl{width:250px;height:60px;bottom:58px;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#7d7d7d,#2b2b2b 75%);box-shadow:0 7px 0 #141414,0 0 0 6px #3a3a3a}
.pan .vsl::after{content:"";position:absolute;left:100%;top:22px;width:100px;height:14px;margin-left:6px;border-radius:0 8px 8px 0;background:linear-gradient(#6b4a2f,#3a2615)}
.pan .ing{bottom:70px}
.pot .vsl,.fry .vsl{width:190px;height:124px;bottom:54px;border:9px solid #a3adb9;border-top-width:6px;border-radius:8px 8px 46px 46px;background:var(--wc);box-shadow:inset 0 10px 14px rgba(255,255,255,.15)}
.pot .vsl::before,.pot .vsl::after,.fry .vsl::before,.fry .vsl::after{content:"";position:absolute;top:12px;width:28px;height:11px;border-radius:6px;background:#a3adb9}
.pot .vsl::before,.fry .vsl::before{left:-40px}.pot .vsl::after,.fry .vsl::after{right:-40px}
.pot .ing,.fry .ing{bottom:78px}
.flames{z-index:1;gap:26px;bottom:30px}
.bb{position:absolute;bottom:4px;width:9px;height:9px;border:2px solid rgba(255,255,255,.85);border-radius:50%;opacity:0;animation:rise 1.6s infinite}
@keyframes rise{20%{opacity:1}to{transform:translateY(-95px);opacity:0}}
.mix .vsl{width:220px;height:104px;bottom:58px;border-radius:0 0 110px 110px;background:linear-gradient(#f4f6f8,#c7d2db);box-shadow:inset 0 -10px 0 rgba(0,0,0,.1)}
.mix .vsl::before{content:"";position:absolute;left:-8px;right:-8px;top:-9px;height:14px;border-radius:8px;background:#e6edf2}
.mix .ing{bottom:96px}
.cutb{position:relative;z-index:1}.cu{position:relative}
.cp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;line-height:1;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.tray{position:absolute;left:12px;top:10px;display:flex;gap:10px;align-items:center;font-size:26px;z-index:2}.tray .w{opacity:.5}
.toBowl{animation:tb .45s forwards}@keyframes tb{to{transform:translate(-130px,-95px) scale(.3);opacity:0}}
.ok{font-size:26px;color:var(--mint);font-weight:600}
.bs{position:absolute;pointer-events:none}.eg{position:absolute;width:22px;height:15px;border-radius:50%;background:#ffd84a;border:4px solid #fff6d6}
.plate .dish{inset:auto;top:0;bottom:0;left:50%;aspect-ratio:1/1;height:100%;transform:translateX(-50%)}
.ws{position:absolute;left:40%;top:30%;width:60px;height:10px}.ws b{position:absolute;bottom:0;left:0;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(6px);animation:st 2.2s infinite}.ws b:nth-child(2){left:20px;animation-delay:.7s}.ws b:nth-child(3){left:40px;animation-delay:1.4s}
.cap{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(15,25,35,.8);padding:3px 14px;border-radius:99px;font-weight:600;white-space:nowrap}
.flames b{transform:scaleY(calc(var(--fire,0)*(.5 + var(--heat)*.6)))}
.coals i{opacity:calc(.2 + var(--fire,0)*.8);box-shadow:0 0 calc(4px + var(--fire,0)*26px) #ff7a2f}
.oven .vsl{background:radial-gradient(circle,rgba(255,140,40,calc(.12 + var(--fire,0)*.7)),#1a1a1a 85%);box-shadow:0 0 calc(var(--fire,0)*50px) rgba(255,120,30,.7)}
.steam{opacity:calc(var(--fire,0)*(.25 + var(--heat)*.75))}
.knob{display:flex;align-items:center;gap:12px;margin-top:12px;padding:8px 18px 8px 8px;border-radius:99px;background:var(--glass);width:100%;transition:.2s}
.knob i{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ddd,#777);box-shadow:0 3px 0 #333;position:relative;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.knob i::after{content:'';position:absolute;left:50%;top:5px;width:5px;height:16px;margin-left:-2.5px;background:#222;border-radius:3px}
.knob.on i{transform:rotate(130deg)}.knob.on{background:rgba(255,120,40,.25);outline:2px solid #ff8a3d}.knob b{font-weight:600}
.sc2{display:flex;font-size:11px;color:var(--mute);margin-top:4px}.sc2 span{text-align:center;overflow:hidden;white-space:nowrap}
.cutb{cursor:pointer;min-width:130px;min-height:120px;display:flex;align-items:center;justify-content:center}.cutb .cu{animation:nud 1.2s infinite}.cutb .cu.toBowl{animation:tb .45s forwards}@keyframes nud{50%{transform:scale(1.07)}}
.kit.td{height:300px;display:flex;align-items:center;justify-content:center}.kit.td::after{display:none}
.pot2{position:relative;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,#d5dbe2 0 74%,#8d97a3 76% 82%,#c4ccd4 84%);box-shadow:0 8px 16px rgba(0,0,0,.5),0 0 calc(var(--fire,0)*34px) rgba(255,120,30,.9);touch-action:none;cursor:grab;z-index:2}
.pot2::before,.pot2::after{content:'';position:absolute;top:46%;width:34px;height:14px;background:#8d97a3;border-radius:7px}.pot2::before{left:-30px}.pot2::after{right:-30px}
.liq{position:absolute;inset:11%;border-radius:50%;box-shadow:inset 0 4px 10px rgba(0,0,0,.4)}
.pot2 .pc{position:absolute;transform:translate(-50%,-50%)}.bt{animation:din .6s var(--d) backwards}.gp{position:absolute;inset:8%}
.dt{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}

function patkD(ed){const F=ed?'':FL(),pa=S.pa||Array(12).fill(4),pc=S.pa?S.pcn:1,RR=[43,36,29,22];let o=`<div class=bs style='inset:${ed?0:3}%;border-radius:50%;background:radial-gradient(circle,#b4bcc3 0 66%,#8f99a1 70% 78%,#f1f4f6 80% 86%,#98a2aa 88% 94%,#6f7a83 96%);box-shadow:0 4px 8px rgba(0,0,0,.4)'></div>`;
for(let i=0;i<12;i++){let s='';for(let j=0;j<pa[i];j++)s+=`<i class='pce ${j%2?'eg':'km'}' style='left:${50+RR[j]}%'></i>`;if(ed&&pa[i]<4)s+=`<i class='pce mk' style='left:${50+RR[pa[i]]}%'></i>`;o+=`<div class=spk style='--a:${i*30}deg;filter:${F}'>${s}</div>`}
if(pc){for(let k=0;k<5;k++){const a=(18+k*72)*Math.PI/180,b=(54+k*72)*Math.PI/180;o+=`<i class=gp2 style='left:${50+Math.cos(b)*13}%;top:${50+Math.sin(b)*13}%;--r:${54+k*72}deg;filter:${F}'></i><i class=tmh style='left:${50+Math.cos(a)*13}%;top:${50+Math.sin(a)*13}%;filter:${F}'></i>`}o+='<i class=tms></i>'}else if(ed)o+='<i class=pcm></i>';return o}
const RG=[{R:40,N:10,T:11,s:0},{R:27,N:7,T:10,s:20}];
function pcs(i,F,mk){const g=i<20?RG[0]:RG[1],j=i-g.s,pair=2*Math.PI*g.R/g.N,LE=pair*.64,LK=pair*.36,k=j%2,len=k?LK:LE,arc=(j>>1)*pair+(k?LE:0)+len/2,th=-90+arc/g.R*57.2958;return `<div class=spk style='--a:${th}deg;filter:${F}'><i class='pc2 ${mk?'mk':k?'pm':'pe'}' style='left:${50+g.R}%;width:${g.T+(k?1.5:0)}%;height:${len}%'></i></div>`}
function patS(i){S.pn=0;S.pcn=0;S.pa=1;go(bar(2)+`<h3>Tepsiyi diz</h3><div class=ptb id=ptb onclick=ptp()></div><p class=hint id=pth></p><button class=go2 onclick=ptr()>Halkayı tamamla</button><button class=go2 id=pcb disabled onclick=ptc()>🍅 Ortayı doldur</button><button class=go id=pgo2 disabled onclick='S.pad=1;cook(${i})'>🔥 Fırına ver</button>`);patR()}
function patR(){$('#ptb').innerHTML=patkD(1);const n=S.pn;$('#pth').textContent=n>=34?(S.pcn?'Hazır! Fırına verebilirsin.':'İki halka tamam. Şimdi ortayı doldur.'):`${n<20?'Dış halka':'İç halka'} — sıradaki: ${n%2?'🥩 kıyma':'🍆 patlıcan'}. Tepsiye dokun.`;$('#pcb').disabled=n<34;$('#pgo2').disabled=!(n>=34&&S.pcn)}
function ptp(){if(S.pn<34){S.pn++;patR();noise(.08,.1,1200);snd(S.pn%2?300:240,.06,'triangle',.12)}}
function ptr(){S.pn=S.pn<20?20:34;patR();snd(520,.12,'triangle',.12)}
function ptc(){S.pcn=1;patR();snd(600,.1,'triangle',.12)}
function patkD(ed){const F=ed?'':FL(),n=S.pa?S.pn:34,pc=S.pa?S.pcn:1;let o=`<div class=bs style='inset:${ed?0:3}%;border-radius:50%;background:radial-gradient(circle,#b4bcc3 0 66%,#8f99a1 70% 78%,#f1f4f6 80% 86%,#98a2aa 88% 94%,#6f7a83 96%);box-shadow:0 4px 8px rgba(0,0,0,.4)'></div>`;
for(let i=0;i<n;i++)o+=pcs(i,F);if(ed&&n<34)o+=pcs(n,'',1);
if(pc){for(let k=0;k<5;k++){const a=(18+k*72)*Math.PI/180,b=(54+k*72)*Math.PI/180;o+=`<i class=gp2 style='left:${50+Math.cos(b)*11}%;top:${50+Math.sin(b)*11}%;--r:${54+k*72}deg;filter:${F}'></i><i class=tmh style='left:${50+Math.cos(a)*10}%;top:${50+Math.sin(a)*10}%;width:11%;filter:${F}'></i>`}o+='<i class=tms style="width:9%"></i>'}return o}
ap();
home();
</script></body></html>
